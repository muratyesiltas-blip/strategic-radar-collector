# Strategic Radar collector: source catalog
#
# Each feed: id, name, url (RSS/Atom), home (site front page, used to auto-discover
# a feed when url is missing or broken), files (Strategic Radar file ids the feed
# feeds by default; the keyword classifier adds or confirms files), type
# (international | local | official | party | diaspora | thinktank), lang, rel
# (Admiralty source-reliability letter A-F; the model still sets the credibility
# number), kind (news | thinktank).
#
# A feed that fails three runs in a row is retried with auto-discovery from
# `home`. data/status.json shows the health of every feed after each run.
# Edit this file freely: the next run picks it up.

defaults:
  timeout: 12
  workers: 16
  max_items_per_feed: 40

