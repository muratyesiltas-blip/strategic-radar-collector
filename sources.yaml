# GDELT DOC 2.0 (free, updated every 15 minutes) fills the gap for outlets
# without public feeds: wires (Reuters, AP, AFP, Bloomberg), the FT and the
# national press in the allowlist below. Queries run per file; results are
# kept only when the domain is in gdelt.domains.
gdelt:
  enabled: true
  timespan: "4h"          # look-back per run (runs every 2 hours, with overlap)
  maxrecords: 120
  pause_seconds: 6        # GDELT asks for at most one request every 5 seconds
  turkish_query: '(Erdoğan OR Fidan OR TBMM OR "AK Parti" OR CHP OR MHP OR "DEM Parti" OR PKK OR "Dışişleri" OR "Milli Savunma")' 
  domains:
    reuters.com: {name: Reuters, rel: B, type: international}
    apnews.com: {name: AP, rel: B, type: international}
    france24.com: {name: France 24 / AFP, rel: B, type: international}
    bloomberg.com: {name: Bloomberg, rel: B, type: international}
    ft.com: {name: Financial Times, rel: B, type: international}
    bbc.com: {name: BBC News, rel: B, type: international}
    bbc.co.uk: {name: BBC News, rel: B, type: international}
    aljazeera.com: {name: Al Jazeera, rel: B, type: international}
    al-monitor.com: {name: Al-Monitor, rel: B, type: international}
    politico.eu: {name: Politico Europe, rel: B, type: international}
    dailysabah.com: {name: Daily Sabah, rel: C, type: local}
    hurriyetdailynews.com: {name: Hürriyet Daily News, rel: B, type: local}
    aa.com.tr: {name: Anadolu Agency, rel: B, type: local}
    trtworld.com: {name: TRT World, rel: C, type: local}
    turkiyetoday.com: {name: Türkiye Today, rel: C, type: local}
    bianet.org: {name: Bianet, rel: B, type: local}
    timesofisrael.com: {name: Times of Israel, rel: B, type: local}
    haaretz.com: {name: Haaretz, rel: B, type: local}
    jpost.com: {name: Jerusalem Post, rel: B, type: local}
    ynetnews.com: {name: Ynetnews, rel: B, type: local}
    arabnews.com: {name: Arab News, rel: B, type: local}
    aawsat.com: {name: Asharq Al-Awsat, rel: B, type: local}
    thenationalnews.com: {name: The National, rel: B, type: local}
    gulfnews.com: {name: Gulf News, rel: B, type: local}
    khaleejtimes.com: {name: Khaleej Times, rel: B, type: local}
    timesofoman.com: {name: Times of Oman, rel: C, type: local}
    rudaw.net: {name: Rudaw, rel: B, type: local}
    kurdistan24.net: {name: Kurdistan24, rel: C, type: local}
    iranintl.com: {name: Iran International, rel: C, type: diaspora}
    tehrantimes.com: {name: Tehran Times, rel: C, type: official}
    kyivindependent.com: {name: Kyiv Independent, rel: B, type: local}
    pravda.com.ua: {name: Ukrainska Pravda, rel: B, type: local}
    ukrinform.net: {name: Ukrinform, rel: B, type: official}
    meduza.io: {name: Meduza, rel: B, type: local}
