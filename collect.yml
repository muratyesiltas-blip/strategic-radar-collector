name: collect

# Runs the collector every two hours and publishes its output to the `data`
# branch as a single commit (force-pushed), so the repository never grows.
# Claude tasks read: https://raw.githubusercontent.com/<owner>/<repo>/data/latest.json

on:
  schedule:
    - cron: "17 */2 * * *"   # every two hours at :17 UTC
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt

      - name: Restore previous data (state, store, archive)
        run: |
          mkdir -p out
          if git ls-remote --exit-code --heads origin data >/dev/null 2>&1; then
            git fetch -q --depth 1 origin data
            git archive FETCH_HEAD | tar -x -C out
          fi

      - name: Collect
        run: python collector/collect.py --data out

      - name: Publish to the data branch
        run: |
          cd out
          rm -rf .git
          git init -q -b data
          git config user.name "radar-collector"
          git config user.email "radar-collector@users.noreply.github.com"
          git add -A
          git commit -q -m "data $(date -u +%Y-%m-%dT%H:%MZ)"
          git push -q -f "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" data
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
